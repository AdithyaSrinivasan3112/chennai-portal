<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>Chennai Portal</title>
  <link rel="stylesheet" href="css/portal.css">
  <!-- Fetch the app's own modules in parallel (no build step, so no bundle). -->
  <link rel="modulepreload" href="js/core/config.js">
  <link rel="modulepreload" href="js/core/time.js">
  <link rel="modulepreload" href="js/core/schema.js">
  <link rel="modulepreload" href="js/portal/slideshow.js">
  <link rel="modulepreload" href="js/portal/weather.js">
  <link rel="modulepreload" href="js/portal/overlays.js">
</head>
<body class="portal" data-mode="home">

  <!-- ============================================================ -->
  <!-- HOME — digital photo frame                                   -->
  <!-- ============================================================ -->
  <section class="screen screen-home" id="screen-home">
    <!-- Two layers crossfade. The gradient behind them is the
         "never blank" fallback if no photo can be loaded. -->
    <div class="slides" aria-hidden="true">
      <img class="slide" id="slide-a" alt="" decoding="async">
      <img class="slide" id="slide-b" alt="" decoding="async">
    </div>
    <div class="home-scrim" aria-hidden="true"></div>

    <div class="home-clock">
      <div class="home-time" data-clock="time">--:--</div>
      <div class="home-date" data-clock="date">&nbsp;</div>
    </div>
    <div class="home-caption" id="slide-caption" hidden></div>
  </section>

  <!-- ============================================================ -->
  <!-- GOOD MORNING                                                 -->
  <!-- ============================================================ -->
  <section class="screen screen-morning" id="screen-morning" hidden>
    <div class="morning-hero">
      <p class="morning-brand">Chennai Portal</p>
      <h1 class="morning-greeting">Good Morning</h1>
      <div class="morning-time" data-clock="time">--:--</div>
      <div class="morning-date" data-clock="date">&nbsp;</div>
    </div>

    <article class="panel panel-note" id="note-panel" data-empty="true">
      <h2 class="panel-label">From the family</h2>
      <p class="note-text" id="note-text"></p>
      <p class="note-from" id="note-from" hidden></p>
    </article>

    <div class="morning-side">
      <article class="panel panel-weather" id="weather-panel" data-state="loading">
        <h2 class="panel-label">Chennai weather</h2>
        <div class="wx-main">
          <svg class="wx-icon" aria-hidden="true"><use data-part="icon" href="#i-cloud"></use></svg>
          <div class="wx-temp" data-part="temp">—</div>
          <div class="wx-text">
            <div class="wx-desc" data-part="desc">Checking the weather…</div>
            <div class="wx-feels" data-part="feels"></div>
          </div>
        </div>
        <div class="wx-facts" data-part="facts"></div>
        <div class="wx-sun" data-part="sun"></div>
        <div class="panel-foot" data-part="foot"></div>
      </article>

      <article class="panel panel-air" id="air-panel" data-state="loading" data-level="">
        <h2 class="panel-label">Air quality</h2>
        <div class="aq-main">
          <div class="aq-value" data-part="value">—</div>
          <div class="aq-text">
            <div class="aq-category" data-part="category">Checking air quality…</div>
            <div class="aq-detail" data-part="detail"></div>
          </div>
        </div>
        <div class="panel-foot" data-part="foot"></div>
      </article>

      <article class="panel panel-today">
        <h2 class="panel-label">Today's reminders</h2>
        <ul class="today-list" id="today-list"></ul>
      </article>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- GOOD NIGHT — near-black, dim red clock, nothing else         -->
  <!-- ============================================================ -->
  <section class="screen screen-night" id="screen-night" hidden>
    <div class="night-time" data-clock="time">--:--</div>
    <div class="night-date" data-clock="date">&nbsp;</div>
  </section>

  <!-- ============================================================ -->
  <!-- Overlays (text is always set with textContent)               -->
  <!-- ============================================================ -->
  <div class="overlay overlay-reminder" id="reminder-overlay" role="alertdialog" aria-labelledby="reminder-title" hidden>
    <div class="card">
      <div class="card-kicker">
        <svg class="card-icon" aria-hidden="true"><use href="#i-bell"></use></svg>
        <span data-part="kicker">Reminder</span>
      </div>
      <h2 class="card-title" id="reminder-title" data-part="title"></h2>
      <p class="card-text" data-part="text"></p>
      <p class="card-more" data-part="more" hidden></p>
      <button type="button" class="card-button" data-part="ack">Done</button>
    </div>
  </div>

  <div class="overlay overlay-message" id="message-overlay" role="alertdialog" aria-labelledby="message-title" hidden>
    <div class="card">
      <div class="card-kicker">
        <svg class="card-icon" aria-hidden="true"><use href="#i-chat"></use></svg>
        <span>Message</span>
      </div>
      <h2 class="card-title" id="message-title" data-part="title" hidden></h2>
      <p class="card-text" data-part="text"></p>
      <p class="card-meta" data-part="meta"></p>
      <button type="button" class="card-button" data-part="dismiss">OK</button>
    </div>
  </div>

  <!-- Connection indicator: a small dot; words appear only when not
       connected. Tap it for version/diagnostics. -->
  <button type="button" class="status" id="status" data-state="connecting" aria-live="polite">
    <span class="status-dot" aria-hidden="true"></span>
    <span class="status-label" id="status-label">Connecting…</span>
  </button>

  <!-- Icon sprite (inline: no extra requests). -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <defs>
      <path id="cloud-shape" d="M7 19h10.5a4 4 0 0 0 .5-7.97 6 6 0 0 0-11.6 1.6A3.3 3.3 0 0 0 7 19z"/>
    </defs>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>
      </g>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/>
    </symbol>
    <symbol id="i-partly" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3v1.3M3 8h1.3M4.5 4.5l.9.9M11.5 4.5l-.9.9M5.3 11.3A3.2 3.2 0 1 1 11 6.9"/>
        <use href="#cloud-shape" transform="translate(1.5 1)"/>
      </g>
    </symbol>
    <symbol id="i-partly-night" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 7.5A4 4 0 0 1 6 2.8a4.2 4.2 0 0 0-1.4 7.9"/>
        <use href="#cloud-shape" transform="translate(1.5 1)"/>
      </g>
    </symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><use href="#cloud-shape"/></g>
    </symbol>
    <symbol id="i-fog" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <use href="#cloud-shape" transform="translate(0 -3)"/>
        <path d="M5 19.5h14M7.5 22h9"/>
      </g>
    </symbol>
    <symbol id="i-drizzle" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <use href="#cloud-shape" transform="translate(0 -3)"/>
        <path d="M9 19.5v.6M13 19.5v.6M17 19.5v.6M11 22v.3M15 22v.3"/>
      </g>
    </symbol>
    <symbol id="i-rain" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <use href="#cloud-shape" transform="translate(0 -3)"/>
        <path d="M9 19l-1 2.6M13 19l-1 2.6M17 19l-1 2.6"/>
      </g>
    </symbol>
    <symbol id="i-storm" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <use href="#cloud-shape" transform="translate(0 -3)"/>
        <path d="M12.8 16.5l-2 3h3l-2 3"/>
      </g>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 2h-15z"/>
        <path d="M10 20.5a2 2 0 0 0 4 0"/>
      </g>
    </symbol>
    <symbol id="i-chat" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M4 5h16v11H10l-4.5 4v-4H4z"/>
    </symbol>
  </svg>

  <!--
    Boot watchdog (classic script; runs even if ES modules don't).
    The app's own modules have no CDN dependencies at load time, so this
    only fires if the site's files themselves fail. It keeps a basic
    clock running so the tablet never looks frozen.
  -->
  <script>
    function chennaiBootFailed(reason) {
      if (window.chennaiBooted || window.chennaiFallbackClock) return;
      var label = document.getElementById('status-label');
      document.getElementById('status').setAttribute('data-state', 'error');
      label.textContent = 'App failed to start — ' + reason;
      function tick() {
        var now = new Date();
        var t = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        var d = now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
        var times = document.querySelectorAll('[data-clock="time"]');
        var dates = document.querySelectorAll('[data-clock="date"]');
        for (var i = 0; i < times.length; i++) times[i].textContent = t;
        for (var j = 0; j < dates.length; j++) dates[j].textContent = d;
      }
      tick();
      window.chennaiFallbackClock = setInterval(tick, 15000);
    }
    setTimeout(function () { chennaiBootFailed('scripts did not load'); }, 15000);
  </script>
  <script nomodule>
    chennaiBootFailed('this browser does not support ES modules');
  </script>
  <script type="module" src="js/portal/main.js"
          onerror="chennaiBootFailed('could not load js/portal/main.js')"></script>
</body>
</html>
