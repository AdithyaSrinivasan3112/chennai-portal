<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Placeholder artwork for Chennai Portal: a red-brick clock-tower station at evening. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27335f"/>
      <stop offset="0.6" stop-color="#8c5a7a"/>
      <stop offset="1" stop-color="#e8946b"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b44a33"/>
      <stop offset="1" stop-color="#7e2f22"/>
    </linearGradient>
    <pattern id="windows" width="56" height="84" patternUnits="userSpaceOnUse" x="12" y="0">
      <path d="M14 70 V36 a14 14 0 0 1 28 0 V70 Z" fill="#f4c27c"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- main block -->
  <rect x="180" y="600" width="1240" height="270" fill="url(#brick)"/>
  <rect x="180" y="610" width="1240" height="84" fill="url(#windows)" opacity="0.9"/>
  <rect x="180" y="720" width="1240" height="84" fill="url(#windows)" opacity="0.75"/>
  <g fill="#e6d3b3">
    <rect x="168" y="588" width="1264" height="14" rx="3"/>
    <rect x="180" y="700" width="1240" height="10"/>
    <rect x="180" y="810" width="1240" height="10"/>
  </g>
  <!-- corner turrets -->
  <g fill="url(#brick)">
    <rect x="170" y="500" width="90" height="100"/>
    <rect x="1340" y="500" width="90" height="100"/>
  </g>
  <g fill="#e6d3b3">
    <path d="M160 500 Q215 430 270 500 Z"/>
    <path d="M1330 500 Q1385 430 1440 500 Z"/>
    <rect x="212" y="410" width="6" height="30"/>
    <rect x="1382" y="410" width="6" height="30"/>
  </g>
  <!-- clock tower -->
  <rect x="730" y="300" width="140" height="300" fill="url(#brick)"/>
  <g fill="#e6d3b3">
    <rect x="718" y="290" width="164" height="14" rx="3"/>
    <rect x="718" y="470" width="164" height="10"/>
    <path d="M722 290 L800 200 L878 290 Z"/>
    <rect x="796" y="160" width="8" height="44"/>
    <circle cx="800" cy="156" r="9"/>
  </g>
  <circle cx="800" cy="385" r="44" fill="#f7efdc" stroke="#e6d3b3" stroke-width="6"/>
  <g stroke="#2a1d1a" stroke-width="5" stroke-linecap="round">
    <path d="M800 385 V356"/>
    <path d="M800 385 L820 396"/>
  </g>
  <path d="M770 600 V520 a30 30 0 0 1 60 0 V600 Z" fill="#f4c27c"/>
  <!-- road and traffic light trails -->
  <rect y="870" width="1600" height="130" fill="#221c26"/>
  <g stroke-linecap="round" stroke-width="5">
    <path d="M60 925 h220 M420 935 h160 M900 925 h260" stroke="#f6d38a" opacity="0.7"/>
    <path d="M200 960 h180 M700 965 h240 M1240 958 h200" stroke="#e05a4a" opacity="0.65"/>
  </g>
</svg>
