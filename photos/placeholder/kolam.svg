  <g fill="#e8a33d">
    <circle cx="800" cy="500" r="30" opacity="0.9"/>
    <circle cx="800" cy="410" r="10"/>
    <circle cx="890" cy="500" r="10"/>
    <circle cx="800" cy="590" r="10"/>
    <circle cx="710" cy="500" r="10"/>
